[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

[context.deploy-preview]
command = "node scripts/netlify-validation.mjs && npm run build"

[[headers]]
for = "/sitemap.xml"
[headers.values]
Content-Type = "application/xml"
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/robots.txt"
[headers.values]
Content-Type = "text/plain"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

# Old brand domain: send everything to the matching page on shalandasmith.com
[[redirects]]
from = "https://unfilteredkeys.com/*"
to = "https://shalandasmith.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.unfilteredkeys.com/*"
to = "https://shalandasmith.com/:splat"
status = 301
force = true

# Canonical redirects: duplicate VA pages to canonical URLs
[[redirects]]
from = "/va-loan-killeen-tx"
to = "/killeen-va-loan"
status = 301
force = true

[[redirects]]
from = "/va-loans-killeen"
to = "/killeen-va-loan"
status = 301
force = true

[[redirects]]
from = "/fort-hood-va-loan"
to = "/killeen-va-loan"
status = 301
force = true

[[redirects]]
from = "/va-loans"
to = "/va-loan-texas"
status = 301
force = true

# Retired URLs
[[redirects]]
from = "/loan-programs"
to = "/buy"
status = 301
force = true

[[redirects]]
from = "/apply"
to = "/mortgage-review"
status = 301
force = true

[[redirects]]
from = "/va-funding-fee-calculator"
to = "/calculators/va-funding-fee"
status = 301
force = true

[[redirects]]
from = "/va-loan-calculator-texas"
to = "/calculators/texas-mortgage-payment"
status = 301
force = true

[[redirects]]
from = "/bah-calculator-killeen-tx"
to = "/calculators/bah-housing-budget"
status = 301
force = true

# Old calculator tab URLs go straight to the dedicated pages
[[redirects]]
from = "/calculators"
to = "/calculators/va-funding-fee"
status = 301
force = true
query = {tab = "va-funding-fee"}

[[redirects]]
from = "/calculators"
to = "/calculators/bah-housing-budget"
status = 301
force = true
query = {tab = "bah-buying-power"}

[[redirects]]
from = "/calculators"
to = "/calculators/texas-mortgage-payment"
status = 301
force = true
query = {tab = "va-loan"}

# No catch-all. Every page is prerendered to its own HTML file
# (scripts/prerender.mjs), and unknown URLs get dist/404.html with a real 404.
